workflows:
  android-workflow:
    name: Al-Razi CommandCenter Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.alrazi.commandcenter"
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Generate Android Skeleton
        script: | 
          flutter create --platforms android .
      - name: Get Flutter packages
        script: | 
          flutter packages pub get
      - name: Build Android APK
        script: | 
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*-release.apk
      
